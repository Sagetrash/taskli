[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskli"
version = "0.1.0"
description = "a simple cli todo list manager"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.21.0",
]

[project.scripts]
taskli = "taskli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/taskli"]